name: Neon preview cleanup

# Deletes a pull request's Neon preview branch when the pull request closes,
# and once a day sweeps every preview/* branch whose git branch is gone, whose
# pull request is closed, or which never had a pull request and is two weeks
# old (scripts/db/neon-preview-sweep.sh says exactly which).
#
# Every preview branch is a fork of production and holds real customer data
# (docs/database-runbook.md §2a). The close event alone missed branches pushed
# and deleted without a pull request, and those copies lived for ever.
#
# The Vercel Marketplace integration makes a `preview/<git branch>` database
# branch for every preview deployment, and only removes it when Vercel removes
# the deployment, which by default is six months later. Neon Free allows ten
# branches, so without this the previews start failing in 0 ms with "Resource
# provisioning failed" (it has happened twice).
#
# Needs the NEON_API_KEY secret and the NEON_PROJECT_ID variable. A pull
# request that never got a preview has no branch; that is a skip, not a failure.
#
# THIS REPOSITORY IS PUBLIC. The key is only ever sent as a header, and nothing
# is printed but the branch name and what happened to it.

on:
  pull_request:
    types: [closed]
  schedule:
    # Off the hour, when GitHub's scheduler is least delayed. Runs from the
    # default branch only.
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  delete-preview-branch:
    # Secrets are not given to pull requests from forks, and a fork's branch
    # name could collide with ours. Only clean up after our own branches.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete preview/<branch> if it exists
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # Through env, never interpolated into the script: a branch name is
          # user-controlled text.
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY}" ] || [ -z "${NEON_PROJECT_ID}" ]; then
            echo "::error::NEON_API_KEY secret or NEON_PROJECT_ID variable is not set."
            exit 1
          fi
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches"
          name="preview/${GIT_BRANCH}"

          id=$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" "$api" \
            | jq -r --arg n "$name" '[.branches[] | select(.name == $n and (.default | not))][0].id // empty')

          if [ -z "$id" ]; then
            echo "No Neon branch named ${name}; nothing to delete."
            exit 0
          fi

          curl -fsS -X DELETE -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" \
            "$api/$id" > /dev/null
          echo "Deleted Neon branch ${name}."

  sweep-preview-branches:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/db/neon-preview-sweep.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # What exists on GitHub, written to files for the script. Only this
      # repository's own pull requests count: a fork's branch name can collide
      # with ours. A failed call fails the step (pipefail), so a half-read list
      # never reaches the script — which also refuses a list missing `main`.
      - name: List git branches and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/sweep"
          mkdir -p "$d"
          gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' > "$d/live"
          for state in open closed; do
            gh api --paginate "repos/${REPO}/pulls?state=${state}&per_page=100"               --jq '.[] | select(.head.repo.full_name == "'"${REPO}"'") | .head.ref' > "$d/${state}"
          done
          echo "$(wc -l < "$d/live") branches, $(wc -l < "$d/open") open and $(wc -l < "$d/closed") closed pull requests."

      - name: Delete preview branches nothing needs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          LIVE_BRANCHES_FILE: ${{ runner.temp }}/sweep/live
          OPEN_PR_FILE: ${{ runner.temp }}/sweep/open
          CLOSED_PR_FILE: ${{ runner.temp }}/sweep/closed
          DEFAULT_GIT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/db/neon-preview-sweep.sh
