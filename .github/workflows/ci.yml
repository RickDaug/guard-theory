name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres, so the waitlist and contact paths under test are the same
    # ones production runs. A mock here would mean the only thing proven is that
    # the mock works. `pg` talks to this container and to Neon's pooler through
    # one code path, which is why that driver was chosen.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guardtheory
          POSTGRES_PASSWORD: guardtheory
          POSTGRES_DB: guardtheory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # sslmode=disable is what tells the client this local container offers no
      # TLS. Neon does, and the same code reads that from its URL instead.
      DATABASE_URL: postgresql://guardtheory:guardtheory@localhost:5432/guardtheory_test?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://guardtheory:guardtheory@localhost:5432/guardtheory_test?sslmode=disable
      # A throwaway portal password, so the sign-in path is actually exercised
      # rather than skipped. The hash is generated below from this value; the
      # value itself is a fixture and unlocks nothing that exists.
      PORTAL_TEST_PASSWORD: ci-only-portal-password-not-a-secret
      # Enough for fulfilCheckoutSession to record an order's mode. No Stripe
      # call is made with it — the integration tests build their own session
      # fixtures rather than talking to Stripe.
      STRIPE_SECRET_KEY: sk_test_ciFixtureNoNetworkCallsAreMadeWithThis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fast gates first: a type error should not wait on a browser download.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --  --max-warnings 0

      # Migrations run BEFORE the unit tests, not after.
      #
      # tests/unit/fulfil.test.ts is an integration test: it drives order
      # creation against a real Postgres, and it deliberately does not skip
      # when DATABASE_URL is set — a test of idempotency that silently skips is
      # the guard that has only ever been green. With the schema not yet
      # applied its setup fails and every case in it is cancelled, which is
      # exactly what this ordering caused on the first CI run.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Unit tests
        run: npm run test:unit

      # Products, then prices and stock. The fixture script invents figures, so
      # it refuses to run against anything but a loopback database — see
      # scripts/db/seed-e2e-fixtures.mjs. Without it the checkout suite has no
      # purchasable product to exercise.
      # Derived rather than stored, so there is no hash in the repository that
      # could ever be mistaken for the real one.
      - name: Generate a portal password hash for the run
        run: |
          HASH=$(node -e '
            const { pathToFileURL } = require("node:url");
            (async () => {
              const { hashPassword } = await import(pathToFileURL("src/lib/portal/auth.ts").href);
              process.stdout.write(await hashPassword(process.env.PORTAL_TEST_PASSWORD));
            })();
          ')
          echo "PORTAL_PASSWORD_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Seed products and test fixtures
        run: |
          npm run db:seed
          npm run db:seed-e2e

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --only-shell --with-deps

      # Runs the e2e specs and the four-breakpoint capture. The config starts
      # its own production server and never reuses an existing one — a server
      # started before the last build serves stale asset hashes and produces
      # failures that do not exist in the code.
      - name: End-to-end and screenshots
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only after the cheap gates pass. No point auditing a build that fails to
    # typecheck.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The script builds with indexing enabled itself and exits non-zero if
      # any category falls below threshold: performance 90, accessibility 95,
      # best practices 95, SEO 95.
      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: docs/lighthouse/
          retention-days: 7
