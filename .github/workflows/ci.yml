name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fast gates first: a type error should not wait on a browser download.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --  --max-warnings 0

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --only-shell --with-deps

      # Runs the e2e specs and the four-breakpoint capture. The config starts
      # its own production server and never reuses an existing one — a server
      # started before the last build serves stale asset hashes and produces
      # failures that do not exist in the code.
      - name: End-to-end and screenshots
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only after the cheap gates pass. No point auditing a build that fails to
    # typecheck.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The script builds with indexing enabled itself and exits non-zero if
      # any category falls below threshold: performance 90, accessibility 95,
      # best practices 95, SEO 95.
      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: docs/lighthouse/
          retention-days: 7
